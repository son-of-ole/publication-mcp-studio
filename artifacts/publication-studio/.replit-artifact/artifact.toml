kind = "web"
previewPath = "/"
title = "Publications"
version = "1.0.0"
id = "artifacts/publication-studio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19344

[services.development]
run = "pnpm --filter @workspace/publication-studio run dev"

[services.production]
build = [ "pnpm", "run", "build" ]

[services.production.run]
args = [ "node", "scripts/start-website.mjs" ]

[services.production.run.env]
NODE_ENV = "production"
PORT = "19344"

[services.env]
PORT = "19344"
BASE_PATH = "/"
