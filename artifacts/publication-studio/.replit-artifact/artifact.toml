kind = "web"
previewPath = "/"
title = "Publication MCP Studio"
version = "1.0.0"
id = "artifacts/publication-studio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19344

[services.development]
run = "pnpm --filter @workspace/publication-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/publication-studio", "run", "build" ]
publicDir = "artifacts/publication-studio/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19344"
BASE_PATH = "/"
